name: syntax-help-mcp

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: syntax-help-mcp:local
    container_name: syntax-help-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN}
      MCP_TOKEN: ${MCP_TOKEN}
      EMBED_URL: ${EMBED_URL:-http://giga-embeddings:7997/v1}
      EMBED_MODEL: ${EMBED_MODEL:-Giga-Embeddings-instruct}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_QUERY_PREFIX: "${EMBED_QUERY_PREFIX:-Instruct: Given a question, retrieve passages that answer the question\\nQuery: }"
      PORT: ${PORT:-8004}
      DB_PATH: ${DB_PATH:-/data/help.sqlite}
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - syntax-help

networks:
  syntax-help:
    external: true
